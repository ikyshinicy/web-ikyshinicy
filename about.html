<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iky Shinicy — Rizky Reranza | Creative Systems Builder</title>
  <meta name="description" content="Iky Shinicy adalah nama kreator dari Rizky Reranza, seorang Creative Systems Builder dan Content Creator Indonesia. Spesialisasi: desain visual, video, filmmaking, musik, dan web development melalui pendekatan Human-Led AI Creation."/>
  <meta name="keywords" content="Iky Shinicy, Rizky Reranza, Creative Systems Builder, Content Creator Indonesia, Human-Led AI Creation, desain visual, filmmaking, komposisi musik, web development"/>
  <meta property="og:title" content="Iky Shinicy — Rizky Reranza | Creative Systems Builder"/>
  <meta property="og:description" content="Creative Systems Builder & Content Creator Indonesia. Stay curious, stay creative."/>
  <meta property="og:type" content="website"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="js/colorizer.js"></script>
  <style>
    :root{--sky:#08A8F5;--lime:#B8FF00;--ink:#090909;--white:#fff;--yellow:#FFD21A;--paper:#F7F1E8;--muted:#6b6560;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden;}
    a{color:inherit;text-decoration:none;}
    .noise{position:fixed;inset:0;pointer-events:none;opacity:.06;z-index:9999;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;mix-blend-mode:multiply;}

    header{position:fixed;z-index:1000;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px calc(50% - 550px);background:rgba(247,241,232,.9);backdrop-filter:blur(16px);border-bottom:3px solid var(--ink);}
    .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;}
    .logo-dot{display:inline-block;background:var(--lime);border:2.5px solid var(--ink);border-radius:50%;width:26px;height:26px;box-shadow:3px 3px 0 var(--ink);}
    nav{display:flex;gap:6px;align-items:center;}
    nav a{font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;border:1.5px solid transparent;transition:all .2s;letter-spacing:.3px;}
    nav a:hover,nav a.active{border-color:var(--ink);background:var(--white);}
    nav .nav-cta{background:var(--ink);color:var(--white);border-color:var(--ink);}
    nav .nav-cta:hover{background:var(--sky);border-color:var(--sky);}
    .menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;}
    .menu-btn span{display:block;width:22px;height:2px;background:var(--ink);border-radius:2px;transition:.3s;}

    .page-wrap{width:100%;}
    .about-hero{padding:140px calc(50% - 550px) 80px;display:grid;grid-template-columns:1fr 400px;gap:40px;align-items:center;border-bottom:3px solid var(--ink);}
    .about-visual{position:relative;display:flex;align-items:center;justify-content:center;min-height:380px;}
    .about-illustration{width:100%;max-width:380px;filter:drop-shadow(0 24px 40px rgba(0,0,0,.18));position:relative;z-index:2;}
    .float-slow{animation:about-floaty 5.5s ease-in-out infinite;}
    @keyframes about-floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
    @media (max-width:900px){
      .about-hero{grid-template-columns:1fr;padding-top:120px;}
      .about-visual{order:-1;min-height:auto;margin-bottom:8px;}
      .about-illustration{max-width:280px;}
    }
    .about-alias{font-family:'DM Sans',sans-serif;font-size:16px;font-weight:500;color:var(--sky);letter-spacing:.5px;margin-bottom:8px;}
    .about-card-alias{font-size:13px;color:rgba(9,9,9,.5);margin-top:2px;margin-bottom:0;}
    .about-support{margin-top:28px;}
    .support-label{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
    .support-btns{display:flex;gap:12px;flex-wrap:wrap;}
    .about-name{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(40px,6vw,80px);letter-spacing:-3px;line-height:.88;text-transform:uppercase;margin-bottom:8px;}
    .about-name span{color:var(--sky);}
    .about-role{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:28px;}
    .about-bio{font-size:18px;line-height:1.7;color:var(--ink);margin-bottom:32px;max-width:480px;}
    .about-links{display:flex;gap:12px;flex-wrap:wrap;}
    .social-btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;padding:10px 20px;border:2px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);transition:all .2s;}
    .social-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);}
    .about-visual{display:flex;align-items:center;justify-content:center;}
    .about-card{width:100%;max-width:360px;background:var(--sky);border:3px solid var(--ink);border-radius:24px;padding:40px;box-shadow:12px 12px 0 var(--ink);text-align:center;}
    .about-avatar{width:100px;height:100px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:40px;}
    .about-card-name{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;letter-spacing:-1px;margin-bottom:4px;}
    .about-card-role{font-size:14px;color:rgba(9,9,9,.6);}
    .about-card-loc{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:13px;padding:6px 14px;background:var(--white);border:2px solid var(--ink);border-radius:999px;}

    .about-card-support{display:flex;flex-direction:column;gap:8px;margin-top:20px;}
    .card-sup-btn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;padding:10px 20px;background:var(--white);border:2px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);transition:all .2s;color:var(--ink);}
    .card-sup-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);}



    .contact-section{padding:80px calc(50% - 550px);background:var(--ink);color:var(--white);border-bottom:3px solid var(--sky);}
    .contact-section .section-title{color:var(--white);}
    .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start;}
    .contact-text{font-size:18px;color:rgba(255,255,255,.6);line-height:1.7;margin-bottom:32px;}
    .contact-email{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(20px,3vw,32px);letter-spacing:-1px;color:var(--sky);}
    .contact-email:hover{color:var(--lime);}
    .contact-form{display:flex;flex-direction:column;gap:16px;}
    .form-group{display:flex;flex-direction:column;gap:6px;}
    .form-group label{font-size:13px;font-weight:500;color:rgba(255,255,255,.5);}
    .form-group input,.form-group textarea{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--white);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;resize:vertical;}
    .form-group input:focus,.form-group textarea:focus{border-color:var(--sky);}
    .form-group textarea{min-height:120px;}
    .submit-btn{background:var(--sky);color:var(--ink);font-size:15px;font-weight:500;padding:14px 28px;border-radius:999px;border:2px solid var(--sky);cursor:pointer;transition:all .2s;width:fit-content;}
    .submit-btn:hover{background:var(--lime);border-color:var(--lime);}

    footer{background:rgba(9,9,9,1);color:var(--white);padding:32px calc(50% - 550px);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:13px;}
    .footer-links{display:flex;gap:20px;color:rgba(255,255,255,.4);}
    .footer-links a:hover{color:var(--white);}

    @media(max-width:768px){
      nav{display:none;}
      nav.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:var(--paper);padding:20px 6vw;border-bottom:3px solid var(--ink);gap:8px;}
      .menu-btn{display:flex;}
      .about-hero{grid-template-columns:1fr;gap:40px;}
      .about-visual{order:-1;}
      .contact-grid{grid-template-columns:1fr;}
    }
  </style>
  <link rel="stylesheet" href="css/site.css"/>
  <link rel="stylesheet" href="css/pages.css"/>
</head>
<body>
<div class="noise"></div>

<header>
  <a href="index.html" class="logo"><span class="logo-dot"></span>Iky Shinicy</a>
  <nav id="main-nav">
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="galleryprompt.html">Gallery Prompt</a>
    <a href="service.html">Service</a>
    <a href="about.html" class="active">About</a>
    <a href="#" id="nav-hire" class="nav-cta">Hire Me</a>
  </nav>
  <div class="menu-btn" onclick="document.getElementById('main-nav').classList.toggle('open')">
    <span></span><span></span><span></span>
  </div>
</header>

<div class="page-wrap">

<section class="about-hero">
  <div>
    <div class="about-name" id="about-name"></div>
    <div class="about-alias" id="about-alias">Iky Shinicy</div>
    <div class="about-role" id="about-role"></div>
    <p class="about-bio" id="about-bio"></p>
    <div class="about-support">
      <div class="support-label">Dukung Karya</div>
      <div class="support-btns" id="support-btns"></div>
    </div>
    <div class="about-support" style="margin-top:24px;">
      <div class="support-label">Social Media</div>
      <div class="support-btns" id="social-btns"></div>
    </div>
  </div>

  <div class="about-visual">
    <img class="about-illustration float-slow" src="assets/img/generated/about-final.png" alt="Rizky Reranza illustration"/>
  </div>
</section>



<section class="contact-section">
  <div class="contact-grid">
    <div>
      <h2 class="section-title">Let's Work<br>Together</h2>
      <p class="contact-text">Punya project menarik? Hubungi saya lewat email atau langsung DM di Instagram.</p>
      <a class="contact-email" id="contact-email" href="#"></a>
    </div>
    <div class="contact-form">
      <div class="form-group">
        <label>Nama</label>
        <input type="text" id="form-name" placeholder="Nama kamu"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="form-email" placeholder="email@kamu.com"/>
      </div>
      <div class="form-group">
        <label>Pesan</label>
        <textarea id="form-msg" placeholder="Ceritakan projectnya..."></textarea>
      </div>
      <button class="submit-btn" onclick="submitForm()">Kirim Pesan →</button>
    </div>
  </div>
</section>

</div><!-- end page-wrap -->

<footer>
  <a href="index.html" style="font-family:'Syne',sans-serif;font-weight:800;font-size:16px;">Iky Shinicy</a>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="galleryprompt.html">Gallery Prompt</a>
  </div>
</footer>

<script src="js/data.js"></script>
<script>
  function initAbout() {
    const d = SITE_DATA;
    const p = d.profile;

    // Nama — split jadi 2 baris, nama depan & belakang
    const nameParts = p.name.split(' ');
    const firstName = nameParts[0];
    const lastName = nameParts.slice(1).join(' ');
    document.getElementById('about-name').innerHTML = `${firstName}<br><span>${lastName}</span>`;

    // Role & Bio
    document.getElementById('about-role').textContent = p.role || 'Content Creator · Creative Systems Builder · Human-Led AI Creation';
    document.getElementById('about-bio').innerHTML = (p.bio || '') + (p.quote ? `<br><br><em>"${p.quote}"</em>` : '');

    // Alias/tagline
    if (p.tagline) document.getElementById('about-alias').textContent = p.tagline;

    // Nav hire me
    document.getElementById('nav-hire').href = 'mailto:' + p.email;

    // Contact email
    const emailEl = document.getElementById('contact-email');
    emailEl.textContent = p.email;
    emailEl.href = 'mailto:' + p.email;

    // Support buttons
    const supportMap = [
      { key: 'saweria', icon: '☕', label: 'Saweria' },
      { key: 'kofi',    icon: '💙', label: 'Ko-fi' },
      { key: 'trakteer',icon: '🎯', label: 'Trakteer' },
    ];
    document.getElementById('support-btns').innerHTML = supportMap
      .filter(s => p[s.key])
      .map(s => `<a href="${p[s.key]}" target="_blank" rel="noopener" class="social-btn">${s.icon} ${s.label}</a>`)
      .join('');

    // Social media buttons
    const socialMap = [
      { key: 'facebook',  icon: '📘', label: 'Facebook' },
      { key: 'instagram', icon: '📸', label: 'Instagram' },
      { key: 'x',         icon: '𝕏', label: 'X' },
      { key: 'youtube',   icon: '▶️', label: 'YouTube' },
      { key: 'tiktok',    icon: '🎵', label: 'TikTok' },
    ];
    document.getElementById('social-btns').innerHTML = socialMap
      .filter(s => p[s.key])
      .map(s => `<a href="${p[s.key]}" target="_blank" rel="noopener" class="social-btn">${s.icon} ${s.label}</a>`)
      .join('');

  }

  initAbout();
</script>
<script>
  function submitForm() {
    const name = document.getElementById('form-name').value.trim();
    const email = document.getElementById('form-email').value.trim();
    const msg = document.getElementById('form-msg').value.trim();
    if (!name || !email) { alert('Nama dan email wajib diisi.'); return; }
    const btn = document.querySelector('.submit-btn');
    btn.textContent = '✓ Pesan Terkirim!';
    btn.style.background = '#B8FF00';
    document.getElementById('form-name').value = '';
    document.getElementById('form-email').value = '';
    document.getElementById('form-msg').value = '';
    setTimeout(() => { btn.textContent = 'Kirim Pesan →'; btn.style.background = ''; }, 3000);
  }
</script>
  <div id="support-section"></div>
<script>
  // Load support section jika file tersedia
  fetch('partials/support-section.html')
    .then(r => { if (!r.ok) throw new Error('not found'); return r.text(); })
    .then(html => { document.getElementById('support-section').innerHTML = html; })
    .catch(() => { /* File tidak ada, diabaikan */ });
</script>
<script src="js/chrome.js" defer></script>
</body>
</html>
