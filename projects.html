  <style>
    :root { --sky:#08A8F5;--lime:#B8FF00;--ink:#090909;--white:#fff;--yellow:#FFD21A;--paper:#F7F1E8;--muted:#6b6560; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--white);overflow-x:hidden;}
    a{color:inherit;text-decoration:none;}
    .noise{position:fixed;inset:0;pointer-events:none;opacity:.04;z-index:9999;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;mix-blend-mode:screen;}
    header{position:fixed;z-index:1000;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px calc(50% - 550px);background:rgba(9,9,9,.9);backdrop-filter:blur(16px);border-bottom:2px solid rgba(255,255,255,.08);}
    .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;}
    .logo-dot{display:inline-block;background:var(--lime);border:2px solid rgba(255,255,255,.2);border-radius:50%;width:26px;height:26px;}
    nav{display:flex;gap:6px;align-items:center;}
    nav a{font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;border:1.5px solid transparent;transition:all .2s;color:rgba(255,255,255,.7);}
    nav a:hover,nav a.active{border-color:rgba(255,255,255,.3);color:var(--white);}
    nav .nav-cta{background:var(--white);color:var(--ink);border-color:var(--white);}
    nav .nav-cta:hover{background:var(--sky);border-color:var(--sky);color:var(--white);}
    .menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;}
    .menu-btn span{display:block;width:22px;height:2px;background:var(--white);border-radius:2px;}

    .page-hero{padding:140px calc(50% - 550px) 60px;border-bottom:2px solid rgba(255,255,255,.08);}
    .page-hero h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(48px,8vw,96px);letter-spacing:-4px;line-height:.88;text-transform:uppercase;}
    .page-hero h1 span{color:var(--sky);}
    .page-hero p{margin-top:20px;font-size:18px;color:rgba(255,255,255,.5);max-width:500px;line-height:1.6;}

    /* CATEGORY GRID */
    .categories-container{padding:60px calc(50% - 550px) 100px;}
    .categories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;}

    .cat-card{border-radius:20px;overflow:hidden;cursor:pointer;transition:all .3s;position:relative;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);display:flex;flex-direction:column;}
    .cat-card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.07);}

    .cat-img{width:100%;aspect-ratio:16/9;overflow:hidden;position:relative;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;}
    .cat-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s;}
    .cat-card:hover .cat-img img{transform:scale(1.05);}
    .cat-emoji{font-size:56px;}

    .cat-body{padding:24px 26px 28px;flex:1;display:flex;flex-direction:column;}
    .cat-label{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--sky);margin-bottom:10px;}
    .cat-title{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;letter-spacing:-1px;margin-bottom:10px;line-height:1.1;}
    .cat-desc{font-size:14px;color:rgba(255,255,255,.5);line-height:1.65;flex:1;}

    /* PROGRESS BAR */
    .cat-progress{margin-top:20px;}
    .progress-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .progress-text{font-size:12px;color:rgba(255,255,255,.4);}
    .progress-pct{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:var(--lime);}
    .progress-track{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;}
    .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--lime));transition:width 1s cubic-bezier(.4,0,.2,1);}

    .cat-arrow{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:13px;font-weight:500;color:var(--lime);width:fit-content;}
    .cat-arrow::after{content:'→';transition:transform .2s;}
    .cat-card:hover .cat-arrow::after{transform:translateX(5px);}

    .count-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;background:rgba(8,168,245,.15);color:var(--sky);border-radius:999px;border:1px solid rgba(8,168,245,.2);margin-left:8px;vertical-align:middle;}

    footer{background:rgba(255,255,255,.03);color:rgba(255,255,255,.4);padding:32px calc(50% - 550px);display:flex;justify-content:space-between;align-items:center;border-top:2px solid rgba(255,255,255,.06);flex-wrap:wrap;gap:12px;font-size:13px;}
    .footer-links{display:flex;gap:20px;}
    .footer-links a:hover{color:var(--white);}

    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    .card-anim{animation:fadeUp .5s ease both;}

    @media(max-width:768px){
      nav{display:none;}
      nav.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:var(--ink);padding:20px 20px;border-bottom:2px solid rgba(255,255,255,.08);gap:8px;}
      .menu-btn{display:flex;}

      /* Hero */
      .page-hero{padding:100px 20px 40px;}
      .page-hero h1{font-size:clamp(32px,10vw,56px);letter-spacing:-2px;}
      .page-hero p{font-size:14px;}

      /* Categories — 2 kolom */
      .categories-container{padding:32px 20px 60px;}
      .categories-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
      .cat-img{aspect-ratio:4/3;}
      .cat-emoji{font-size:36px;}
      .cat-body{padding:12px 14px 16px;}
      .cat-title{font-size:16px;letter-spacing:-0.5px;}
      .cat-desc{font-size:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
      .cat-arrow{font-size:11px;margin-top:10px;}

      footer{flex-direction:column;align-items:flex-start;padding:32px 20px;}
    }
  </style>

<script>
  function renderCategories() {
    const projects = SITE_DATA.projects || [];

    // Group by category
    const catMap = {};
    projects.forEach(p => {
      if (!catMap[p.category]) catMap[p.category] = [];
      catMap[p.category].push(p);
    });

    const cats = Object.keys(catMap);

    if (cats.length === 0) {
      document.getElementById('categories-grid').innerHTML =
        '<div style="text-align:center;padding:80px 20px;color:rgba(255,255,255,.3);grid-column:1/-1"><div style="font-size:48px">🎨</div><p style="margin-top:12px;font-size:16px">Belum ada project.</p></div>';
      return;
    }

    // Category emoji map
    const emojiMap = {
      'Web Design': '🌐', 'Web Development': '💻', 'Digital Product': '📖',
      'AI Music': '🎵', 'Music': '🎵', 'Design': '🎨', 'Branding': '✨',
      'Video': '🎬', 'Photography': '📸', 'Illustration': '🖼'
    };

    document.getElementById('categories-grid').innerHTML = cats.map((cat, i) => {
      const items = catMap[cat];
      // Use first project with image as cover, or fallback emoji
      const cover = items.find(p => p.image);
      const emoji = emojiMap[cat] || '🎨';
      // Average progress of projects in category
      const avgProgress = items.some(p => p.progress)
        ? Math.round(items.filter(p => p.progress).reduce((a, b) => a + (parseInt(b.progress) || 0), 0) / items.filter(p => p.progress).length)
        : null;

      return `
        <a href="project-category.html?cat=${encodeURIComponent(cat)}" class="cat-card card-anim" style="animation-delay:${i * 0.1}s">
          <div class="cat-img">
            ${cover ? `<img src="${cover.image}" alt="${cat}" onerror="this.style.display='none'">` : ''}
            <div class="cat-emoji" style="${cover ? 'display:none' : ''}">${emoji}</div>
          </div>
          <div class="cat-body">
            <div class="cat-label">Kategori</div>
            <div class="cat-title">${cat} <span class="count-badge">${items.length}</span></div>
            <div class="cat-desc">${items.map(p => p.title).join(' · ')}</div>
            ${avgProgress !== null ? `
            <div class="cat-progress">
              <div class="progress-label">
                <span class="progress-text">Progress</span>
                <span class="progress-pct">${avgProgress}%</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" style="width:0%" data-width="${avgProgress}%"></div>
              </div>
            </div>` : ''}
            <div class="cat-arrow">Lihat Semua</div>
          </div>
        </a>`;
    }).join('');

    // Animate progress bars
    setTimeout(() => {
      document.querySelectorAll('.progress-fill').forEach(el => {
        el.style.width = el.dataset.width;
      });
    }, 300);
  }

  renderCategories();
</script>
