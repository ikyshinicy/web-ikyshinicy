  <title>Projects — Iky Shinicy</title>

  <style>
    :root { --sky:#08A8F5;--lime:#B8FF00;--ink:#090909;--white:#fff;--yellow:#FFD21A;--paper:#F7F1E8;--muted:#6b6560; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--ink);color:var(--white);overflow-x:hidden;}
    a{color:inherit;text-decoration:none;}
    .noise{position:fixed;inset:0;pointer-events:none;opacity:.04;z-index:9999;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;mix-blend-mode:screen;}
    header{position:fixed;z-index:1000;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px calc(50% - 550px);background:rgba(9,9,9,.9);backdrop-filter:blur(16px);border-bottom:2px solid rgba(255,255,255,.08);}
    .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;}
    .logo-dot{display:inline-block;background:var(--lime);border:2px solid rgba(255,255,255,.2);border-radius:50%;width:26px;height:26px;}
    nav{display:flex;gap:6px;align-items:center;}
    nav a{font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;border:1.5px solid transparent;transition:all .2s;color:rgba(255,255,255,.7);}
    nav a:hover,nav a.active{border-color:rgba(255,255,255,.3);color:var(--white);}
    nav .nav-cta{background:var(--white);color:var(--ink);border-color:var(--white);}
    nav .nav-cta:hover{background:var(--sky);border-color:var(--sky);color:var(--white);}
    .menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;}
    .menu-btn span{display:block;width:22px;height:2px;background:var(--white);border-radius:2px;}

    .page-hero{padding:140px calc(50% - 550px) 60px;border-bottom:2px solid rgba(255,255,255,.08);}
    .back-btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.4);margin-bottom:24px;transition:color .2s;}
    .back-btn:hover{color:var(--white);}
    .back-btn::before{content:'←';}
    .page-hero h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(40px,7vw,80px);letter-spacing:-3px;line-height:.9;text-transform:uppercase;}
    .page-hero h1 span{color:var(--sky);}
    .page-hero p{margin-top:20px;font-size:16px;color:rgba(255,255,255,.5);max-width:500px;line-height:1.6;}

    /* PROJECTS GRID */
    .projects-container{padding:60px calc(50% - 550px) 100px;}
    .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}

    .project-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;transition:all .25s;display:flex;flex-direction:column;cursor:pointer;}
    .project-card:hover{transform:translateY(-5px) scale(1.01);border-color:rgba(255,255,255,.2);box-shadow:0 12px 32px rgba(0,0,0,.4);}
    .project-img{width:100%;aspect-ratio:3/4;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
    .project-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s;}
    .project-card:hover .project-img img{transform:scale(1.06);}
    .project-img .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;}
    .project-card.landscape{grid-column: span 2;}
    .project-card.landscape .project-img{aspect-ratio:16/9;}
    @media(max-width:768px){.project-card.landscape{grid-column:span 3;}}
    .project-body{padding:12px 14px 16px;flex:1;display:flex;flex-direction:column;}
    .project-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
    .project-cat{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--sky);}
    .project-year{font-size:10px;color:rgba(255,255,255,.3);}
    .project-title{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13px;letter-spacing:-0.2px;margin-bottom:6px;line-height:1.3;}
    .project-desc{font-size:11px;color:rgba(255,255,255,.45);line-height:1.55;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

    /* PROGRESS BAR */
    .project-progress{margin-top:10px;}
    .progress-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
    .progress-text{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:.5px;}
    .progress-pct{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:11px;color:var(--lime);}
    .progress-track{height:3px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;}
    .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--lime));transition:width 1.2s cubic-bezier(.4,0,.2,1);}

    .project-link{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:11px;font-weight:600;color:var(--lime);width:fit-content;padding:5px 10px;border:1px solid rgba(184,255,0,.3);border-radius:999px;transition:all .2s;}
    .project-link:hover{background:rgba(184,255,0,.1);}
    .project-link::after{content:'→';transition:transform .2s;}
    .project-card:hover .project-link::after{transform:translateX(4px);}

    footer{background:rgba(255,255,255,.03);color:rgba(255,255,255,.4);padding:32px calc(50% - 550px);display:flex;justify-content:space-between;align-items:center;border-top:2px solid rgba(255,255,255,.06);flex-wrap:wrap;gap:12px;font-size:13px;}
    .footer-links{display:flex;gap:20px;}
    .footer-links a:hover{color:var(--white);}

    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    .card-anim{animation:fadeUp .5s ease both;}

    @media(max-width:768px){
      nav{display:none;}
      nav.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:var(--ink);padding:20px calc(50% - 550px);border-bottom:2px solid rgba(255,255,255,.08);gap:8px;}
      .menu-btn{display:flex;}
      .projects-grid{grid-template-columns:repeat(3,1fr);gap:10px;}
      .categories-container{padding:40px 4vw 80px;}
    }
  </style>

<body>
<div class="noise"></div>

<section class="page-hero">
  <a href="projects.html" class="back-btn">Kembali ke Projects</a>

  <p id="page-desc"></p>
</section>

<div class="projects-container">
  <div class="projects-grid" id="projects-grid"></div>
</div>

<footer>
  <a href="index.html" style="font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--white);">Iky Shinicy</a>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="galleryprompt.html">Gallery</a>
    <a href="about.html">About</a>
  </div>
</footer>

<script src="js/data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const cat = params.get('cat') || '';

  // Set page title
  const titleEl = document.getElementById('page-title');
  const parts = cat.split(' ');
  if (parts.length > 1) {
    titleEl.innerHTML = parts.slice(0, -1).join(' ') + ' <span>' + parts[parts.length - 1] + '</span>';
  } else {
    titleEl.innerHTML = '<span>' + cat + '</span>';
  }
  document.title = cat + ' — Iky Shinicy';

  function renderProjects() {
    const projects = (SITE_DATA.projects || []).filter(p => p.category === cat);

    document.getElementById('page-desc').textContent = projects.length + ' project di kategori ini.';

    if (projects.length === 0) {
      document.getElementById('projects-grid').innerHTML =
        '<div style="text-align:center;padding:80px 20px;color:rgba(255,255,255,.3);grid-column:1/-1"><div style="font-size:48px">🎨</div><p style="margin-top:12px;font-size:16px">Belum ada project di kategori ini.</p></div>';
      return;
    }

    document.getElementById('projects-grid').innerHTML = projects.map((p, i) => `
      <div class="project-card card-anim ${p.category === 'AI Music Studio' ? 'landscape' : ''}" style="animation-delay:${i * 0.08}s">
        <div class="project-img">
          ${p.image ? `<img src="${p.image}" alt="${p.title}" onerror="this.style.display='none'">` : ''}
          <div class="placeholder"></div>
        </div>
        <div class="project-body">
          <div class="project-meta">
            <span class="project-cat">${p.category}</span>
            <span class="project-year">${p.year}</span>
          </div>
          <div class="project-title">${p.title}</div>
          <div class="project-desc">${p.desc || ''}</div>
          ${p.progress ? `
          <div class="project-progress">
            <div class="progress-label">
              <span class="progress-text">PROGRESS</span>
              <span class="progress-pct">${p.progress}%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:0%" data-width="${p.progress}%"></div>
            </div>
          </div>` : ''}
          ${p.link && p.link !== '#'
            ? `<a href="${p.link}" target="_blank" class="project-link">Lihat Project</a>`
            : ''}
        </div>
      </div>
    `).join('');

    // Animate progress bars
    setTimeout(() => {
      document.querySelectorAll('.progress-fill').forEach(el => {
        el.style.width = el.dataset.width;
      });
    }, 400);
  }

  renderProjects();
</script>

<div id="support-section"></div>
<script>
  fetch('partials/support-section.html')
    .then(r => r.text())
    .then(html => { document.getElementById('support-section').innerHTML = html; });
</script>
