  <style>
    :root { --sky:#08A8F5;--blue:#1B6EF3;--lime:#B8FF00;--ink:#0E0E0E;--white:#fff;--paper:#F7F1E8;--muted:#6b6560; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden;}
    a{color:inherit;text-decoration:none;}
    .noise{position:fixed;inset:0;pointer-events:none;opacity:.05;z-index:9999;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;mix-blend-mode:multiply;}
    header{position:fixed;z-index:1000;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px calc(50% - 550px);background:rgba(247,241,232,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(14,14,14,.08);}
    .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;}
    .logo-dot{display:inline-flex;background:var(--lime);border-radius:50%;width:26px;height:26px;overflow:hidden;}
    .logo-dot img{width:100%;height:100%;object-fit:cover;display:block;}
    nav{display:flex;gap:6px;align-items:center;}
    nav a{font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;border:1.5px solid transparent;transition:all .2s;color:#2a2a2a;}
    nav a:hover,nav a.active{background:rgba(14,14,14,.05);color:var(--ink);}
    .menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;}
    .menu-btn span{display:block;width:22px;height:2px;background:var(--ink);border-radius:2px;}

    .page-hero{padding:140px calc(50% - 550px) 52px;}
    .back-btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:22px;transition:color .2s;}
    .back-btn:hover{color:var(--ink);}
    .back-btn::before{content:'←';}
    .page-hero h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(40px,7vw,72px);letter-spacing:-3px;line-height:.92;text-transform:uppercase;}
    .page-hero h1 span{color:var(--blue);}
    .page-hero p{margin-top:18px;font-size:15px;color:var(--muted);max-width:500px;line-height:1.6;}

    /* PROJECTS GRID */
    .projects-container{padding:20px calc(50% - 550px) 100px;background:#E1EFFB;}
    .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}

    .project-card{background:#fff;border:1px solid rgba(14,14,14,.06);border-radius:18px;overflow:hidden;transition:all .25s;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 6px 20px rgba(27,110,243,.08);}
    .project-card:hover{transform:translateY(-6px);border-color:rgba(27,110,243,.2);box-shadow:0 16px 34px rgba(27,110,243,.16);}
    .project-img{width:100%;aspect-ratio:3/4;background:#eef2f8;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
    .project-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s;}
    .project-card:hover .project-img img{transform:scale(1.06);}
    .project-img .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;}
    .project-card.landscape{grid-column: span 2;}
    .project-card.landscape .project-img{aspect-ratio:16/9;}
    @media(max-width:768px){.project-card.landscape{grid-column:span 2;}}
    .project-body{padding:14px 16px 18px;flex:1;display:flex;flex-direction:column;}
    .project-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .project-cat{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--blue);}
    .project-year{font-size:10px;color:var(--muted);}
    .project-title{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;letter-spacing:-0.2px;margin-bottom:6px;line-height:1.3;color:var(--ink);}
    .project-desc{font-size:12px;color:var(--muted);line-height:1.55;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

    /* PROGRESS BAR */
    .project-progress{margin-top:12px;}
    .progress-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
    .progress-text{font-size:10px;color:var(--muted);letter-spacing:.5px;}
    .progress-pct{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;color:var(--blue);}
    .progress-track{height:4px;background:rgba(14,14,14,.08);border-radius:999px;overflow:hidden;}
    .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--sky));transition:width 1.2s cubic-bezier(.4,0,.2,1);}

    .project-link{display:inline-flex;align-items:center;gap:4px;margin-top:12px;font-size:12px;font-weight:600;color:var(--blue);width:fit-content;padding:6px 12px;border:1.5px solid rgba(27,110,243,.25);border-radius:999px;transition:all .2s;}
    .project-link:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
    .project-link::after{content:'→';transition:transform .2s;}
    .project-card:hover .project-link::after{transform:translateX(4px);}

    footer{background:var(--ink);color:rgba(255,255,255,.4);padding:32px calc(50% - 550px);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:13px;}
    .footer-links{display:flex;gap:20px;}
    .footer-links a:hover{color:var(--white);}

    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    .card-anim{animation:fadeUp .5s ease both;}

    @media(max-width:768px){
      nav{display:none;}
      nav.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:var(--paper);padding:20px calc(50% - 550px);border-bottom:1px solid rgba(14,14,14,.08);gap:8px;}
      .menu-btn{display:flex;}
      .page-hero{padding:110px 5vw 32px;}
      .page-hero h1{font-size:clamp(32px,10vw,52px);letter-spacing:-2px;}
      .page-hero p{font-size:13px;}
      .projects-container{padding:16px 5vw 60px;}
      .projects-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
    }
  </style>

  <p id="page-desc"></p>

  <div class="projects-grid" id="projects-grid"></div>

    <a href="galleryprompt.html">Gallery</a>
    <a href="about.html">About</a>
  </div>

<script src="js/data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const cat = params.get('cat') || '';

  // Set page title
  const titleEl = document.getElementById('page-title');
  const parts = cat.split(' ');
  if (parts.length > 1) {
    titleEl.innerHTML = parts.slice(0, -1).join(' ') + ' <span>' + parts[parts.length - 1] + '</span>';
  } else {
    titleEl.innerHTML = '<span>' + cat + '</span>';
  }
  document.title = cat + ' — Iky Shinicy';

  function renderProjects() {
    const projects = (SITE_DATA.projects || []).filter(p => p.category === cat);

    document.getElementById('page-desc').textContent = projects.length + ' project di kategori ini.';

    if (projects.length === 0) {
      document.getElementById('projects-grid').innerHTML =
        '<div style="text-align:center;padding:80px 20px;color:var(--muted);grid-column:1/-1"><div style="font-size:48px">🎨</div><p style="margin-top:12px;font-size:16px">Belum ada project di kategori ini.</p></div>';
      return;
    }

    document.getElementById('projects-grid').innerHTML = projects.map((p, i) => `
      <div class="project-card card-anim ${p.category === 'AI Music Studio' ? 'landscape' : ''}" style="animation-delay:${i * 0.08}s">
        <div class="project-img">
          ${p.image ? `<img src="${p.image}" alt="${p.title}" onerror="this.style.display='none'">` : ''}
          <div class="placeholder"></div>
        </div>
        <div class="project-body">
          <div class="project-meta">
            <span class="project-cat">${p.category}</span>
            <span class="project-year">${p.year}</span>
          </div>
          <div class="project-title">${p.title}</div>
          <div class="project-desc">${p.desc || ''}</div>
          ${p.progress ? `
          <div class="project-progress">
            <div class="progress-label">
              <span class="progress-text">PROGRESS</span>
              <span class="progress-pct">${p.progress}%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:0%" data-width="${p.progress}%"></div>
            </div>
          </div>` : ''}
          ${p.link && p.link !== '#'
            ? `<a href="${p.link}" target="_blank" class="project-link">Lihat Project</a>`
            : ''}
        </div>
      </div>
    `).join('');

    // Animate progress bars
    setTimeout(() => {
      document.querySelectorAll('.progress-fill').forEach(el => {
        el.style.width = el.dataset.width;
      });
    }, 400);
  }

  renderProjects();
</script>
<script src="js/chrome.js" defer></script>
</body>
